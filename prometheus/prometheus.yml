global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "sirius_app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "rabbitmq"
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
      vhost: ["/"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
