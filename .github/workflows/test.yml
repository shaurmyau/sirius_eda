name: Sirius EDA tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      REPO_BACKEND: memory
      RATE_LIMIT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and Pact contract tests
        run: pytest -m "not integration" -v --cov=app --cov-report=xml

      - name: PostgreSQL and RabbitMQ integration tests (Testcontainers)
        run: pytest tests/integration -m integration -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  mutation:
    name: mutmut
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    env:
      CI: "true"
      REPO_BACKEND: memory
      RATE_LIMIT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused unit suite before mutation
        run: pytest tests/unit -q

      - name: Run mutation testing
        run: |
          mutmut run
          mkdir -p reports
          mutmut results | tee reports/mutmut-results.txt

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: reports/mutmut-results.txt
          if-no-files-found: ignore
          retention-days: 14
