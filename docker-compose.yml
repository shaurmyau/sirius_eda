services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sirius_rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "5672:5672"      # AMQP-протокол
      - "15672:15672"    # Веб-интерфейс (Management UI)
      - "15692:15692"  # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: sirius_postgres_exporter
    command:
      - --datasource.uri=db:5432/sirius_food?sslmode=disable
      - --collector.long_running_transactions
      - --collector.stat_activity
      - --collector.stat_database
      - --collector.locks
    environment:
      DATA_SOURCE_USER: sirius
      DATA_SOURCE_PASS: sirius
    depends_on:
      - db
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: sirius_node_exporter
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sirius_prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rabbitmq
      - redis-exporter
      - postgres-exporter
      - node-exporter
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: sirius_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sirius_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sirius_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
volumes:
  pg_data:
